version: "3.8"
services:
    flask:
        build: ./flask
        ports:
        - '5000:5000'
        volumes:
        - flask:.
        environment:
        - FLASK_ENV: development
        - nomeConda: "env-pibiti"
    frontend:
        build: ./frontend
        ports:
        - '5153:5153'
        environment:
        - NODE_ENV: development
    db: # MongoDB
        images: mongo@sha256:936020698d1b62b73f6bd40d52f172eb90e2a79e955aa4de26975100e5e991c6
        ports: 27017:27017
        volumes:
            - db:/data/db

volumes:
    db:
    flask:
