<!DOCTYPE html>
<html lang="pt" >
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Email Template</title>
  <style>
        *{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif
        }
  </style>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f4; font-family: Arial, sans-serif;">

  <!-- Wrapper table -->
  <table border="0" cellpadding="0" cellspacing="0" width="100%" bgcolor="#f4f4f4">
    <tr>
      <td align="center" style="padding: 20px 10px;">
        
        <!-- Main container -->
        <table border="0" cellpadding="0" cellspacing="0" width="600" bgcolor="#ffffff" style="border-radius: 4px; overflow: hidden;">
          
          <!-- Header -->
          <tr>
            <td align="center" bgcolor="#0e0021" style="padding: 20px 0;">
              <img width="200px" aspect-ratio="1/100"  class="logo" src="dummy.png">
            </td>
          </tr>

          <tr>
            <td align="center" bgcolor="#ffffff" style="color: #000000; padding: 20px 0;">
              <h1 class="titulo"> <\TITULO\> </h1>
            </td>
          </tr>
          
          <!-- Body -->
          <tr>
            <!-- ADICIONAR HTML AQUI CONFORME NECESSÁRIO -->
            <td class="corpo-texto" style="padding: 20px; color: #333333; font-size: 16px; line-height: 1.5;">
              
            </td>
          </tr>
          <!-- BOTOES -->
          <tr>
            <td style="padding: 20px; color: #333333; font-size: 16px; line-height: 2lh; padding-left: calc(50vmin - 37%);">
              <table>
                <tr class="botoes">
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td class="rodape" align="center" bgcolor="#ffffff" style="padding: 15px; font-size: 12px; color: #ffffff;">
                <table>
                <tr>
                    <td >
                        <img width="120px" height="100px" style="margin-right: 10px"  class="logo-vip" src="logo_VIP_Lab.png">
                    </td>
                    <td>
                        <img width="110px" height="90px" style="margin-right: 10px" class="logo-ufma" src="logo ufma.png">
                    </td>
                    <td>
                        <img width="120px" height="100px" class="logo-nca" src="LogoNCAFundBranco2000_2021.png">
                    </td>
                </tr>
              </table>
            </td>
          </tr>
          
        </table>
        <!-- End Main container -->

      </td>
    </tr>
  </table>
  <!-- End Wrapper table -->

</body>
</html>
