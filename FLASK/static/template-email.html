<!DOCTYPE html>
<html lang="pt" >
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Email Template</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f4; font-family: Arial, sans-serif;">

  <!-- Wrapper table -->
  <table border="0" cellpadding="0" cellspacing="0" width="100%" bgcolor="#f4f4f4">
    <tr>
      <td align="center" style="padding: 20px 10px;">
        
        <!-- Main container -->
        <table border="0" cellpadding="0" cellspacing="0" width="600" bgcolor="#ffffff" style="border-radius: 4px; overflow: hidden;">
          
          <!-- Header -->
          <tr>
            <td align="center" bgcolor="#007BFF" style="padding: 20px 0;">
              <img width="200px" aspect-ratio="1/100"  class="logo" src="dummy.png">
            </td>
          </tr>

          <tr>
            <td align="center" bgcolor="#007BFF" style="padding: 20px 0;">
              <h1 class="titulo"> <\TITULO\> </h1>
            </td>
          </tr>
          
          <!-- Body -->
          <tr>
            <td class="corpo-texto" style="padding: 20px; color: #333333; font-size: 16px; line-height: 1.5;">
              
            </td>
          </tr>
          
          <tr>
            <td class="botoes" style="padding: 20px; color: #333333; font-size: 16px; line-height: 1.5;">
              <table>
                <tr>
                    <td>
                        <button class="botao-esq"> TEXTO</button>
                    </td>
                    <td>
                        <button class="botao-dir">TEXTO DIR</button>
                    </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td class="rodape" align="center" bgcolor="#ffffff" style="padding: 15px; font-size: 12px; color: #ffffff;">

                <table>
                <tr>
                    <td >
                        <img width="100px" height="100px" style="margin-right: 10px"  class="logo-vip" src="logo_VIP_Lab.png">
                    </td>
                    <td>
                        <img width="100px" height="90px" style="margin-right: 10px" class="logo-ufma" src="logo ufma.png">
                    </td>
                    <td>
                        <img width="100px" height="100px" class="logo-nca" src="LogoNCAFundBranco2000_2021.png">
                    </td>
                </tr>
              </table>
              
            </td>
          </tr>
          
        </table>
        <!-- End Main container -->

      </td>
    </tr>
  </table>
  <!-- End Wrapper table -->

</body>
</html>
