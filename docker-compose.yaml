name: pibiti
services:
    flask: # Flask + Tensorflow
        image: lfaoliveira/flask:latest
        build: 
            context: .
            dockerfile: ./DOCKER/flask/dockerfile
        command: bash -c "uvicorn flask_backend.server:asgi_app --reload --workers 1 --timeout-keep-alive 30 --host 0.0.0.0 --port 5000 --log-level debug"
        working_dir: /app
        depends_on:
            - db
            - redis
            - celery_worker
        ports:
        - '5000:5000'
        environment:
            - FLASK_ENV=production
            - FLASK_BASE_URL=http://31.97.84.210:5000 #TODO: MUDAR PRA IP DO SERVIDOR DE PROD
            #USANDO MESMAS CREDENCIAIS DO DB!
            - MONGO_URI=mongodb://admin:Lf123456@db:27017/PARALISIA6_NERVO?authSource=admin #URLS INTERNAS PODEM USAR DNS DO COMPOSE!
            - CELERY_BROKER_URL=redis://redis:6379/0
            - CELERY_RESULT_BACKEND=redis://redis:6379/0
            - VUE_FRONT_URL=http://31.97.84.210:5173
            #--------- SEGREDOS ---------#
            - MAIL_USERNAME=viplab.psno@nca.ufma.br
            - MAIL_DEFAULT_SENDER=viplab.psno@nca.ufma.br
            - MAIL_PASSWORD=lndd gxkj sdlh sgfo
            - MAIL_SERVER=smtp.gmail.com
            - MAIL_PORT=587
            - MAIL_USE_TLS=True
            - SECRET_KEY=9074578ec4e99fa85eb1267e52861d11356d7b8651172a5eeae6bb85f8928e5e
            - ID_ROOT_FOLDER_GDRIVE=1HGQRjShCSWINVeIjzizpupv9gHmQJi-B
        networks:
            - projeto
        volumes:
            - /root/pibiti:/app
        # env_file:
        #   - .env
        restart: unless-stopped
        
    frontend: #Vue + Vite
        image: lfaoliveira/frontend:latest

        build: 
            context: .
            dockerfile: ./DOCKER/frontend/dockerfile
        depends_on:
            - flask
        ports:
        - '5173:5173'
        environment:
            # URL tem que ser de IP público externo ao docker ja que código do Vite vai rodar no browser
            VITE_BACKEND_URL: http://31.97.84.210:5000 #TODO: MUDAR PARA IP OU DOMÍNIO DA MÁQUINA RODANDO SERVIÇO
            VITE_BACKEND_WS: ws://31.97.84.210:5000 #TODO: MUDAR PARA IP OU DOMÍNIO DA MÁQUINA RODANDO SERVIÇO
            NODE_ENV: development
        networks:
            - projeto
        volumes:
            - /root/pibiti/vite-project:/frontend #TODO: TIRAR BIND MOUNT
            - /frontend/node_modules
        restart: unless-stopped
        command: "npm run dev -- --host"


    celery_worker:
        image: lfaoliveira/celery_worker:latest
        build: 
            context: .
            dockerfile: ./DOCKER/celery/dockerfile
        command: bash -c "pwd && celery -A  flask_backend.celery_worker worker -l INFO --pool=solo --max-memory-per-child=400000"
        working_dir: /app
        depends_on:
            - redis
        environment:
            - CELERY_BROKER_URL=redis://redis:6379/0
            - CELERY_RESULT_BACKEND=redis://redis:6379/0
            - MONGO_URI=mongodb://admin:Lf123456@db:27017/PARALISIA6_NERVO?authSource=admin #URLS INTERNAS PODEM USAR DNS DO COMPOSE!
            - FLASK_BASE_URL=http://31.97.84.210:5000 #TODO: MUDAR PRA IP DO SERVIDOR DE PROD
            - ID_ROOT_FOLDER_GDRIVE=1HGQRjShCSWINVeIjzizpupv9gHmQJi-B

        networks:
            - projeto
        volumes:
            - /root/pibiti:/app
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
        networks:
            - projeto
        restart: unless-stopped

    db: # MongoDB
        image: mongo:7.0.23
        ports: [27017:27017]
        environment:
        - MONGO_INITDB_ROOT_USERNAME=admin
        - MONGO_INITDB_ROOT_PASSWORD=Lf123456
        volumes:
            - db:/data/db
        networks:
        - projeto
        restart: unless-stopped

networks:
    projeto:
        driver: bridge

volumes:
    db: 
    backend: 
    frontend: 
