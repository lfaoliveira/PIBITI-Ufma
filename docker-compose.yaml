version: "3.8"
name: SISTEMA_WEB_PIBITI
services:
    flask: # Flask + Tensorflow
        build: 
          context: .
          dockerfile: ./DOCKER/flask/dockerfile
        ports:
        - '5000:5000'
        # volumes:
        # - ./FLASK:/FLASK
        environment:
          FLASK_ENV: development
    frontend: #Vue + Vite
        build: 
          context: .
          dockerfile: ./DOCKER/frontend/dockerfile
        ports:
        - '5173:5173'
        environment:
          NODE_ENV: development
    db: # MongoDB
        image: mongo@sha256:936020698d1b62b73f6bd40d52f172eb90e2a79e955aa4de26975100e5e991c6
        ports: [27017:27017]
        volumes:
            - db:/data/db

volumes:
    db:
    flask:
