name: SISTEMA_WEB_PIBITI
services:
    flask: # Flask + Tensorflow
        build: 
          context: .
          dockerfile: ./DOCKER/flask/dockerfile
        depends_on:
          - db
        ports:
        - '5000:5000'
        environment:
          FLASK_ENV: production
          MONGO_URI: mongodb://31.97.84.210:27017/PARALISIA6_NERVO
        networks:
          - teste
        volumes:
          - flask:/FLASK
        restart: unless-stopped
    frontend: #Vue + Vite
        build: 
          context: .
          dockerfile: ./DOCKER/frontend/dockerfile
        depends_on:
          - flask
        ports:
        - '5173:5173'
        environment:
          VITE_API_URL: http://31.97.84.210:5000
          NODE_ENV: development
        networks:
          - teste
        volumes:
          - frontend:/frontend
        restart: unless-stopped
    db: # MongoDB
      image: mongo@sha256:936020698d1b62b73f6bd40d52f172eb90e2a79e955aa4de26975100e5e991c6
      ports: [27017:27017]
      volumes:
          - db:/data/db
      networks:
        - teste
      restart: unless-stopped

networks:
  teste:

volumes:
    db: 
    flask: 
    frontend: 
