name: pibiti
services:
    flask: # Flask + Tensorflow
        image: lfaoliveira/flask:latest
        build: 
          context: .
          dockerfile: ./DOCKER/flask/dockerfile
        depends_on:
          - db
          - redis
          - celery_worker
        ports:
        - '5000:5000'
        environment:
          - FLASK_ENV=production
          #USANDO MESMAS CREDENCIAIS DO DB!
          - MONGO_URI=mongodb://admin:Lf123456@db:27017/PARALISIA6_NERVO?authSource=admin #URLS INTERNAS PODEM USAR DNS DO COMPOSE!
          - CELERY_BROKER_URL=redis://redis:6379/0
          - CELERY_RESULT_BACKEND=redis://redis:6379/0
          - VUE_FRONT_URL=http://31.97.84.210:5173
        networks:
          - projeto
        volumes:
          - flask:/flask_backend
        restart: unless-stopped
        
    frontend: #Vue + Vite
        image: lfaoliveira/frontend:latest

        build: 
          context: .
          dockerfile: ./DOCKER/frontend/dockerfile
        depends_on:
          - flask
        ports:
        - '5173:5173'
        environment:
        # URL tem que ser de IP público externo ao docker ja que código do Vite vai rodar no browser
          VITE_BACKEND_URL: http://31.97.84.210:5000 #MUDAR PARA IP OU DOMÍNIO DA MÁQUINA RODANDO SERVIÇO
          NODE_ENV: development
        networks:
          - projeto
        volumes:
          - frontend:/frontend
        restart: unless-stopped


    celery_worker:
      image: lfaoliveira/celery_worker:latest
      build: 
          context: .
          dockerfile: ./DOCKER/celery/dockerfile
      command: bash -c "pwd && celery -A celery_worker worker -l INFO"
      volumes:
        - celery:/app
      depends_on:
        - redis
      environment:
        - CELERY_BROKER_URL=redis://redis:6379/0
        - CELERY_RESULT_BACKEND=redis://redis:6379/0
      networks:
        - projeto
      restart: unless-stopped

    redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        networks:
          - projeto
        restart: unless-stopped


    db: # MongoDB
      image: mongo:7.0.23
      ports: [27017:27017]
      environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=Lf123456
      volumes:
        - db:/data/db
      networks:
      - projeto
      restart: unless-stopped

networks:
  projeto:
    driver: bridge

volumes:
    db: 
    flask: 
    frontend: 
    celery: